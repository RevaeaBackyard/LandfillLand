name: Dependency validation
on:
  pull_request:
    paths:
      - '**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.33.0
      - name: Resolve dependency lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Capture dependency audit
        if: always()
        run: pnpm audit --json > dependency-audit.json || test -s dependency-audit.json
      - name: Lint
        run: pnpm lint
      - name: Build and type check
        if: success() || failure()
        run: pnpm build
      - name: Upload resolution and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-validation
          path: |
            pnpm-lock.yaml
            dependency-audit.json
          retention-days: 7
