name: Dependency validation
on:
  pull_request:
    paths:
      - '**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.33.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture dependency audit
        if: always()
        run: pnpm audit --json > dependency-audit.json || test -s dependency-audit.json
      - name: Security regression tests
        run: node scripts/check-braces-security.cjs
      - name: Lint
        run: pnpm lint
      - name: Build and type check
        if: success() || failure()
        run: pnpm build
      - name: Install browser for smoke checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke checks
        run: node scripts/check-site-smoke.mjs
      - name: Upload resolution and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-validation
          path: |
            pnpm-lock.yaml
            dependency-audit.json
            dist/_astro/*.css
            scripts/check-braces-security.cjs
            smoke-results
          retention-days: 7
